services:
  db:
    image: postgres:16-alpine
    container_name: travelplanner_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelplanner}
      POSTGRES_USER: ${POSTGRES_USER:-travelplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelplanner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: travelplanner_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travelplanner}:${POSTGRES_PASSWORD:-travelplanner}@db:5432/${POSTGRES_DB:-travelplanner}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
